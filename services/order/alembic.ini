# A generic, single database configuration.

[alembic]
# Path to migration scripts, relative to this file.
script_location = %(here)s/migrations

# Template used to generate migration file names.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Prepend the service root to sys.path so `app` and `migrations` are importable.
prepend_sys_path = .

# Path separator used to split list values.
path_separator = os

# Consumed by env.py only: the real URL always comes from `settings.database_url`.
sqlalchemy.url = postgresql+asyncpg://order_user:dev_password@localhost:5434/order_db


[post_write_hooks]
# post_write_hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME


# Logging configuration, consumed by env.py only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
