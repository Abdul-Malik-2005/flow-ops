# A generic, single database configuration.

[alembic]
# Path to migration scripts, relative to this file.
script_location = %(here)s/migrations

# Prepend the service root to sys.path so `app` and `migrations` are importable.
prepend_sys_path = .

# Path separator used to split list values.
path_separator = os

# Consumed by env.py only: the real URL always comes from `settings.database_url`.
sqlalchemy.url = postgresql+asyncpg://notification_user:dev_password@localhost:5435/notification_db


[post_write_hooks]

# Logging configuration, consumed by env.py only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
