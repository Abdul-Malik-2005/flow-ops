[project]
name = "notification"
version = "0.1.0"
description = ""
authors = [
    {name = "Abdul-Malik-2005", email = "profi.child21@gmail.com"}
]
requires-python = ">=3.14,<4"
dependencies = [
    "sqlalchemy[asyncio] (>=2.1.6,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "aio-pika (>=10.2.3,<11.0.0)",
    "aiosmtplib (>=5.1.3,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1,<2.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "jsonschema (>=4.26,<5)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers"
markers = [
    "integration: requires a real PostgreSQL database (TEST_DATABASE_URL)",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic", "sqlalchemy"]

[tool.ruff]
extend-exclude = [
    "migrations/versions",
]
